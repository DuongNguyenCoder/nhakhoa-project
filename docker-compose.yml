services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: minhdental-backend
    restart: always
    env_file:
      - ../config/.env.backend
    depends_on:
      - mongodb
    networks:
      - app-network
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./client
      dockerfile: dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=https://api.minhdental.com
        - NEXT_PUBLIC_API_URL=https://api.minhdental.com/api
    container_name: minhdental-frontend
    restart: always
    env_file:
      - ../config/.env.frontend
    depends_on:
      - backend
    networks:
      - app-network

  mongodb:
    image: mongo:7
    container_name: minhdental-mongodb
    restart: always
    command: ["--bind_ip_all"]
    ports:
      - "0.0.0.0:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin##123
    volumes:
      - ../../data/mongodb:/data/db
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: minhdental-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../config/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ../config/ssl:/etc/nginx/ssl
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
