version: "3.9"

services:
  mongodb:
    image: mongo:7
    volumes:
      - /var/www/minhdental/data/mongodb:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}

  backend:
    build: ./backend
    env_file:
      - ../config/.env
    depends_on:
      - mongodb

  frontend:
    build: ./frontend

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ../config/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
