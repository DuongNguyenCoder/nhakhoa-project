version: "3.9"

services:
  backend:
    build: ./backend
    container_name: minhdental-backend
    restart: always
    env_file:
      - ../config/.env.backend
    depends_on:
      - mongodb
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: minhdental-frontend
    restart: always
    env_file:
      - ../config/.env.frontend
    networks:
      - app-network

  mongodb:
    image: mongo:7
    container_name: minhdental-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin##123
    volumes:
      - ../../data/mongodb:/data/db
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: minhdental-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../config/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
