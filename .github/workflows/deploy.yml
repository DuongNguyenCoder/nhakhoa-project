name: Deploy To VPS MinhDental

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: adminsvtech
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/minhdental/app
            git pull origin main
            docker compose down
            docker compose up -d --build
